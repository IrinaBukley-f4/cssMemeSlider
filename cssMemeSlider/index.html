<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mynerve&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <h1>cssMemeSlider</h1>
        <div class="container">
            <input type="radio" name="radio" id="first" checked>
            <input type="radio" name="radio" id="second">
            <input type="radio" name="radio" id="third">
            <input type="radio" name="radio" id="fourth">
            <div class="images">
                <img class="img img-visible" src="./img/img-1.jpg" alt="img-1">
                <img class="img" src="./img/img-2.jpg" alt="img-2">
                <img class="img" src="./img/img-3.jpg" alt="img-3">
                <img class="img" src="./img/img-4.jpg" alt="img-4">
            </div>
            <div class="descr">
                <p class="text text-visible">Женщине много не надо, ей нужно <span>Вce.</span></p>
                <p class="text">Настроение: проснулась и как давай <span>жить!</span></p>
                <p class="text">Себя не выбирают! Какая есть, такую  <span>и люблю!</span> </p>
                <p class="text">Хороших людей осталось мало. <span>Берегите меня!</span></p>
            </div>
            <div class="labels">
                <label for="first"><div class="dot one"></div></label>
                <label for="second"><div class="dot two"></div></label>
                <label for="third"><div class="dot three"></div></label>
                <label for="fourth"><div class="dot four"></div></label>
            </div>
        </div>
    </main>
</body>
</html>
